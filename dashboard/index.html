<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>AREA 51</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css"/>

  <script>
    // Apply saved theme synchronously before React paints, to avoid a
    // flash-of-wrong-theme on page load. Mirrors the React-managed effect
    // in App; both write to area51:theme.
    (function () {
      try {
        var t = localStorage.getItem('area51:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* private mode etc.; fall through to dark default */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- postal-mime: parses the raw .eml client-side; the email modal fetches and
       parses it as soon as it opens. An ESM module that publishes
       window.PostalMime, so the Babel-transpiled scripts below can reach it. -->
  <script type="module">
    import PostalMime from 'https://esm.sh/postal-mime@3.0.0';
    window.PostalMime = PostalMime;
  </script>

  <script type="text/babel" data-presets="react" src="js/ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/tabs.jsx"></script>
  <script type="text/babel" data-presets="react" src="js/app.jsx"></script>
</body>
</html>
